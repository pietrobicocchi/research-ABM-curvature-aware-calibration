# Network SIR (Table 1, App. B.2). Shared by every netsir_* experiment.
population: 150             # N agents
dt: 1.0
kappa: 20.0                 # sharpness of the lockdown gate
kappa_init: 50.0            # sharpness of the relaxed initial-infection assignment
gumbel_tau: 0.5             # Gumbel-sigmoid temperature
prior_sd:                   # log scale for beta, gamma, I0; logit scale for t_lock, f_lock
  beta: 0.30
  gamma: 0.30
  I0: 0.30
  t_lock: 0.50
  f_lock: 0.60
random_features: 128        # D, frozen; median-heuristic bandwidth
seeds: 128                  # M
base_seed: 20250714         # simulation seeds; base_seed + 1 draws the random features
operating_points:
  A:
    beta: 0.03
    gamma: 0.06
    I0: 0.03
    t_lock: 0.20
    f_lock: 0.30
    mean_degree: 6
    graph_seed: 17
    horizon: 40
  B:
    beta: 0.045
    gamma: 0.10
    I0: 0.03
    t_lock: 0.15
    f_lock: 0.25
    mean_degree: 8
    graph_seed: 29
    horizon: 40
