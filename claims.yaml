# Empirical claims of the paper, one entry per claim; checked by scripts/check_claims.py.
#
# location   section/caption and line of the submission source
# values     as printed in the paper, in the printed units:
#              "7.4"    must equal the code value rounded to the printed precision
#                       (decimals as printed; integers without their trailing zeros,
#                       "2.5e4" to the printed mantissa)
#              "<0.2"   strict bound on the unrounded code value
#              "<=0.5"  "within" bound on the code value at the printed precision
#              true     a qualitative statement; the check returns whether it holds
# experiment the experiment the claim belongs to
# code       the file (and function) that produce the value
# note       how a value is defined, and known differences from the text

# ------------------------------------------------------------------ Fig. 1
- id: path_d_data_first_iterate
  location: "Sec. 3.3, l. 496"
  sentence: "the number of data-dominant directions is already correct at the first iterate"
  values: {holds: true}
  experiment: mfsir_calibration_path
  code: {file: experiments/mfsir_calibration_path.py, function: compute}

- id: path_angle_at_start
  location: "Sec. 3.3, l. 497"
  sentence: "the leading eigenspace lies 7.4 deg from its final orientation at the start"
  values: {angle_deg: "7.4"}
  experiment: mfsir_calibration_path
  code: {file: experiments/mfsir_calibration_path.py, function: compute}
  note: "Leading eigenspace = leading-2 subspace (leading-1: 3.1 deg, leading-3: 0.02 deg)."

- id: path_within_1deg_loss_ratio
  location: "Sec. 3.3, l. 498-499"
  sentence: "within 1 deg while the loss is still 926 times its final value"
  values: {angle_deg: "<=1", loss_over_final: "926"}
  experiment: mfsir_calibration_path
  code: {file: experiments/mfsir_calibration_path.py, function: compute}
  note: >
    Read at the first checkpoint after the start (step 8): angle 1.02 deg, loss ratio
    925.6. The code's own threshold is 5 deg. The angle rises again to 9.9 deg at
    step 24 and first stays below 1 deg at step 368 (loss 1.47x final).

- id: path_start_displacement
  location: "Fig. 1 caption, l. 507"
  sentence: "from a start displaced by one prior standard deviation in each coordinate"
  values: {z_init: "1"}
  experiment: mfsir_calibration_path
  code: {file: configs/mfsir_calibration_path.yaml}

- id: path_caption_panel_c
  location: "Fig. 1 caption, l. 509"
