[project]
name = "gndiag"
version = "0.1.0"
description = "Gauss-Newton identifiability diagnostic for differentiable agent-based models"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gndiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
